name: Publicar dashboard cifrado

# O gh-pages recebe SOMENTE a versão cifrada do painel. A senha vive como secret
# do repositório (DASHBOARD_SENHA) e nunca entra em arquivo nenhum.
#
# Enquanto o secret não existir, o job de publicação é PULADO em silêncio, não
# falha. Job que falha manda email do GitHub a cada push, e em 01/09 isso encheu
# a caixa do Vini. Como o contexto `secrets` NÃO é permitido num `if` de job,
# quem lê o secret é o job "checar", que expõe só um sim ou não como saída.

on:
  push:
    branches: [claude/vini-cavalcanti-job-campaign-gciixk]
    paths:
      - "docs/index.html"
      - "automacao/cifra-dashboard.mjs"
      - ".github/workflows/publica-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publica-dashboard
  cancel-in-progress: true

jobs:
  checar:
    runs-on: ubuntu-latest
    outputs:
      tem_senha: ${{ steps.senha.outputs.tem_senha }}
    steps:
      - id: senha
        env:
          DASHBOARD_SENHA: ${{ secrets.DASHBOARD_SENHA }}
        run: |
          if [ -n "$DASHBOARD_SENHA" ]; then
            echo "tem_senha=sim" >> "$GITHUB_OUTPUT"
          else
            echo "tem_senha=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret DASHBOARD_SENHA ausente. Publicação pulada, nada foi exposto."
          fi

  publicar:
    needs: checar
    if: needs.checar.outputs.tem_senha == 'sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cifrar o painel
        env:
          DASHBOARD_SENHA: ${{ secrets.DASHBOARD_SENHA }}
        run: node automacao/cifra-dashboard.mjs docs/index.html "$RUNNER_TEMP/index.html"

      - name: Conferir que nada saiu em claro
        run: |
          for termo in Wingfeather E-Line PROSPECTOS "const STUDIOS"; do
            if grep -qF "$termo" "$RUNNER_TEMP/index.html"; then
              echo "::error::O arquivo publicado contém \"$termo\" em texto puro. Abortado."
              exit 1
            fi
          done
          echo "ok: só cifra no arquivo de saída"

      - name: Publicar em gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add gh gh-pages
          cp "$RUNNER_TEMP/index.html" gh/index.html
          touch gh/.nojekyll
          git -C gh add index.html .nojekyll
          if git -C gh diff --cached --quiet; then
            echo "nada mudou"
          else
            git -C gh commit -m "publica dashboard cifrado (${GITHUB_SHA::7})"
            git -C gh push origin gh-pages
          fi
